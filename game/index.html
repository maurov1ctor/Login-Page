<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#140f1d">
<title>Monster Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
  /* Layout: tela do jogo ocupa o topo inteiro (diorama 2.5D), console de controles embaixo. */
  :root {
    --ink:#140f1d; --panel:#1e1730; --panel2:#2a2042; --edge:#0b0812;
    --gold:#f2c45a; --gold-d:#8a4f22; --red:#d8483e; --red-d:#6e1a36; --cream:#f6ead0; --muted:#8f84ad;
    --font:'Pixelify Sans', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html,body,#root { margin:0; height:100%; background:var(--ink); overflow:hidden; font-family:var(--font); color:var(--cream); }
  #app { display:flex; flex-direction:column; height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); background:var(--ink); }

  #screen { position:relative; flex:1 1 auto; min-height:0; margin:8px 8px 6px; border-radius:18px; overflow:hidden; background:#7d6650;
            box-shadow:0 0 0 2px var(--edge), 0 0 0 4px #3a2d55, 0 12px 30px rgba(0,0,0,.6); }
  #game { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); image-rendering:pixelated; image-rendering:crisp-edges; }

  #banner { position:absolute; left:0; right:0; top:18px; display:flex; flex-direction:column; align-items:center; gap:2px; pointer-events:none;
            opacity:0; animation:banner 4.2s ease 0.6s forwards; text-shadow:0 2px 0 #140f1d, 0 0 12px rgba(0,0,0,.6); }
  #banner b { font-size:26px; font-weight:700; letter-spacing:.04em; color:var(--cream); }
  #banner span { font-size:12px; letter-spacing:.24em; text-transform:uppercase; color:var(--gold); }
  #banner::after { content:""; width:140px; height:2px; margin-top:6px; background:linear-gradient(90deg,transparent,var(--gold),transparent); }
  @keyframes banner { 0%{opacity:0; transform:translateY(-6px)} 15%,75%{opacity:1; transform:none} 100%{opacity:0} }

  #flash { position:absolute; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.on { animation:flash .9s ease; }
  @keyframes flash { 0%,30%,60%{opacity:0} 15%,45%{opacity:.85} 100%{opacity:0} }

  #msg { position:absolute; left:10px; right:10px; bottom:10px; padding:16px 16px 18px; display:none; font-size:16px; line-height:1.45;
         background:linear-gradient(180deg,#2a2042f2,#1a1328f2); border:2px solid #4a3a6e; border-radius:12px;
         box-shadow:0 0 0 2px var(--edge), 0 8px 20px rgba(0,0,0,.5); }
  #name { position:absolute; left:14px; top:-13px; padding:3px 10px; font-size:13px; font-weight:700; color:var(--ink); background:var(--gold); border-radius:6px;
          box-shadow:0 0 0 2px var(--edge); }
  #name:empty { display:none; }
  #msg.withp { padding-left:104px; min-height:108px; }
  #pf { display:none; position:absolute; left:10px; top:12px; width:84px; height:84px; border-radius:8px; overflow:hidden;
        background:radial-gradient(circle at 40% 35%, #4a3a6e, #1a1328); box-shadow:inset 0 0 0 2px rgba(242,196,90,.35), 0 0 0 2px var(--edge); }
  #msg.withp #pf { display:block; }
  #pcv { width:84px; height:84px; image-rendering:pixelated; image-rendering:crisp-edges; display:block; }
  #msg.withp #name { left:104px; }
  #more { position:absolute; right:12px; bottom:6px; font-style:normal; font-size:12px; color:var(--gold); animation:bob .6s ease-in-out infinite alternate; }
  @keyframes bob { to { transform:translateY(3px); } }

  #toast { position:absolute; left:50%; top:12px; transform:translate(-50%,-8px); padding:6px 12px; border-radius:8px; font-size:13px; white-space:nowrap;
           background:#1e1730ee; border:1px solid var(--gold); color:var(--cream); opacity:0; pointer-events:none; transition:opacity .25s, transform .25s; }
  #toast.on { opacity:1; transform:translate(-50%,0); }
  #fish { position:absolute; left:50%; top:18%; transform:translateX(-50%); width:min(82%,320px); display:none; flex-direction:column; align-items:center; gap:8px;
          padding:12px 14px; background:linear-gradient(180deg,#2a2042f2,#1a1328f2); border:2px solid #4a3a6e; border-radius:12px; box-shadow:0 0 0 2px var(--edge), 0 8px 20px rgba(0,0,0,.5); }
  #fish b { font-size:14px; color:var(--gold); letter-spacing:.08em; text-transform:uppercase; }
  .fbar { position:relative; width:100%; height:20px; border-radius:10px; background:#140f1d; box-shadow:inset 0 2px 4px rgba(0,0,0,.6), 0 0 0 2px #3a2d55; overflow:hidden; }
  #fzone { position:absolute; top:0; bottom:0; background:linear-gradient(180deg,#9ae0a0,#3f8c4a); }
  #fzone.rare { background:linear-gradient(180deg,#ffe08a,#c98a2c); }
  #fcur { position:absolute; top:0; bottom:0; width:4px; margin-left:-2px; background:var(--cream); box-shadow:0 0 6px #fff; }
  #fish span { font-size:12px; color:var(--muted); }
  #catch { position:absolute; left:10px; right:10px; bottom:10px; display:none; gap:14px; align-items:center; padding:14px;
           background:linear-gradient(180deg,#2a2042f2,#1a1328f2); border:2px solid #4a3a6e; border-radius:12px; box-shadow:0 0 0 2px var(--edge), 0 8px 20px rgba(0,0,0,.5); }
  #catch.rare { border-color:var(--gold); box-shadow:0 0 0 2px var(--edge), 0 0 24px rgba(242,196,90,.45); }
  #ccv { flex:none; width:96px; image-rendering:pixelated; padding:8px; border-radius:10px; background:radial-gradient(circle,#3a2d55,#18122a); }
  #catch div { display:flex; flex-direction:column; gap:4px; min-width:0; }
  #cname { font-size:17px; color:var(--gold); }
  #cdesc { font-size:14px; line-height:1.4; }
  #catch small { font-size:11px; color:var(--muted); letter-spacing:.1em; text-transform:uppercase; }
  #err { position:absolute; inset:0; display:none; align-items:center; justify-content:center; padding:24px; text-align:center; font-size:15px; }

  /* console */
  #pad { flex:none; position:relative; height:min(34%,230px); min-height:180px; margin:0 8px 8px; border-radius:20px;
         background:linear-gradient(180deg,var(--panel2),var(--panel)); box-shadow:0 0 0 2px var(--edge), inset 0 2px 0 rgba(255,255,255,.06); }
  #stick { position:absolute; left:max(16px,5%); top:50%; width:150px; height:150px; margin-top:-75px; border-radius:50%;
           background:radial-gradient(circle at 50% 50%, #18122a 0 38%, #241c3a 39% 62%, #2e2448 63% 100%);
           box-shadow:0 0 0 2px var(--edge), inset 0 4px 10px rgba(0,0,0,.55), inset 0 -2px 0 rgba(255,255,255,.05); }
  #stick::before { content:""; position:absolute; inset:14px; border-radius:50%; border:2px dashed rgba(246,234,208,.08); }
  #knob { position:absolute; left:50%; top:50%; width:66px; height:66px; margin:-33px 0 0 -33px; border-radius:50%; pointer-events:none;
          background:radial-gradient(circle at 38% 30%, #fbe9a0 0%, var(--gold) 45%, #c98a2c 80%, #8a4f22 100%);
          box-shadow:0 6px 0 #6a3a14, 0 10px 18px rgba(0,0,0,.55), inset 0 2px 2px rgba(255,255,255,.5); transition:transform .12s ease-out; }
  #knob::after { content:""; position:absolute; inset:18px; border-radius:50%; background:radial-gradient(circle, #e8b84a, #c98a2c); box-shadow:inset 0 2px 3px rgba(0,0,0,.35); }
  #stick.on #knob { transition:none; }
  .btn { position:absolute; width:72px; height:72px; border:0; border-radius:50%; font:700 24px var(--font); color:var(--cream);
         box-shadow:0 6px 0 var(--d), 0 10px 16px rgba(0,0,0,.5), inset 0 3px 3px rgba(255,255,255,.3), inset 0 -4px 6px rgba(0,0,0,.25);
         transition:transform .05s, box-shadow .05s; text-shadow:0 2px 0 rgba(0,0,0,.35); }
  .btn:active, .btn.on { transform:translateY(5px); box-shadow:0 1px 0 var(--d), 0 3px 6px rgba(0,0,0,.5), inset 0 3px 3px rgba(255,255,255,.2), inset 0 -4px 6px rgba(0,0,0,.25); }
  .btn:focus-visible { outline:2px solid var(--cream); outline-offset:4px; }
  #btnA { right:max(16px,6%); top:22px; --d:var(--red-d); background:radial-gradient(circle at 35% 28%, #f2804e 0%, var(--red) 55%, #a82a3c 100%); }
  #btnB { right:calc(max(16px,6%) + 90px); top:66px; --d:var(--gold-d); color:#3a2414; text-shadow:0 1px 0 rgba(255,255,255,.4);
          background:radial-gradient(circle at 35% 28%, #fbe9a0 0%, var(--gold) 55%, #c98a2c 100%); }
  .hint { position:absolute; width:72px; text-align:center; font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); }
  #hA { right:max(16px,6%); top:104px; }
  #hB { right:calc(max(16px,6%) + 90px); top:148px; }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="game"></canvas>
    <div id="banner"><b>Vila Âmbar</b><span>Praça do Sol Poente</span></div>
    <div id="flash"></div>
    <div id="msg"><div id="pf"><canvas id="pcv" width="48" height="48"></canvas></div><div id="name"></div><span id="txt"></span><i id="more">▼</i></div>
    <div id="toast"></div>
    <div id="fish"><b>Fisgou!</b><div class="fbar"><div id="fzone"></div><div id="fcur"></div></div><span>Aperte A com o cursor na faixa</span></div>
    <div id="catch"><canvas id="ccv" width="32" height="32"></canvas><div><b id="cname"></b><span id="cdesc"></span><small>A para continuar</small></div></div>
    <div id="err">Seu navegador não conseguiu iniciar o WebGL. Tente abrir no Chrome ou Safari atualizados.</div>
  </div>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <button class="btn" id="btnB">B</button><span class="hint" id="hB">Correr</span>
    <button class="btn" id="btnA">A</button><span class="hint" id="hA">Ação</span>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="sprites2.js"></script>
<script src="game.js"></script>
</body>
</html>
