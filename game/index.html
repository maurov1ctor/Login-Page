<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#11141f">
<title>Monster Quest</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  :root {
    --ink:#11141f; --panel:#1b2033; --panel2:#262c45; --edge:#0a0c14; --lcd:#000;
    --gold:#f4c542; --gold-d:#a8801c; --red:#e8505b; --red-d:#9c2a35; --txt:#e9ecf5;
    --font:'Press Start 2P', ui-monospace, Menlo, Consolas, monospace;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html,body,#root { margin:0; height:100%; background:var(--ink); overflow:hidden; font-family:var(--font); color:var(--txt); }
  #app { display:flex; flex-direction:column; height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
         background:radial-gradient(120% 70% at 50% 0%, #232a45 0%, var(--ink) 70%); }

  /* tela */
  #screen { flex:1 1 auto; min-height:0; display:flex; align-items:center; justify-content:center; padding:12px 10px 6px; }
  #bezel { position:relative; padding:8px; border-radius:14px; background:linear-gradient(160deg,#2c3350,#171b2b);
           box-shadow:0 0 0 2px var(--edge), 0 10px 24px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.08); }
  canvas { display:block; background:var(--lcd); border-radius:4px; box-shadow:0 0 0 2px #000; }
  #msg { position:absolute; left:14px; right:14px; bottom:14px; min-height:34%; padding:.9em 1.1em; display:none;
         background:#f8f8f8; color:#383838; border:4px solid #384878; border-radius:8px; outline:3px solid #f8f8f8;
         box-shadow:0 0 0 7px #384878; line-height:1.7; }
  #more { position:absolute; right:.8em; bottom:.5em; font-style:normal; color:#d03030; animation:blink .7s steps(2) infinite; }
  @keyframes blink { 50% { opacity:0; } }

  /* controles */
  #pad { flex:none; height:min(36%,250px); min-height:190px; position:relative; margin:0 6px 8px; border-radius:22px 22px 28px 28px;
         background:linear-gradient(180deg,var(--panel2),var(--panel)); box-shadow:inset 0 2px 0 rgba(255,255,255,.07), 0 0 0 2px var(--edge); }

  #dpad { position:absolute; left:max(18px,5%); top:50%; width:156px; height:156px; margin-top:-78px; touch-action:none; }
  #dpad .arm { position:absolute; width:52px; height:52px; background:linear-gradient(145deg,#4a5278,#2a304b); box-shadow:0 3px 0 #11142200, 0 0 0 2px var(--edge); }
  #dpad .arm::after { content:""; position:absolute; left:50%; top:50%; border:9px solid transparent; transform:translate(-50%,-50%); opacity:.55; }
  #dpad .up    { left:52px; top:0;     border-radius:12px 12px 0 0; } #dpad .up::after    { border-bottom:12px solid #cfd6f5; border-top:0; }
  #dpad .down  { left:52px; top:104px; border-radius:0 0 12px 12px; } #dpad .down::after  { border-top:12px solid #cfd6f5; border-bottom:0; }
  #dpad .left  { left:0;     top:52px; border-radius:12px 0 0 12px; } #dpad .left::after  { border-right:12px solid #cfd6f5; border-left:0; }
  #dpad .right { left:104px; top:52px; border-radius:0 12px 12px 0; } #dpad .right::after { border-left:12px solid #cfd6f5; border-right:0; }
  #dpad .mid   { position:absolute; left:52px; top:52px; width:52px; height:52px; background:linear-gradient(145deg,#3a4064,#242a43); }
  #dpad .mid::after { content:""; position:absolute; inset:16px; border-radius:50%; background:#1a1f33; box-shadow:inset 0 2px 3px rgba(0,0,0,.6); }
  #dpad .arm.on { background:linear-gradient(145deg,var(--gold),var(--gold-d)); }
  #dpad .arm.on::after { opacity:1; filter:brightness(.25); }

  .btn { position:absolute; width:74px; height:74px; border:0; border-radius:50%; font:700 20px var(--font); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.35);
         box-shadow:0 6px 0 var(--d), 0 9px 14px rgba(0,0,0,.45), inset 0 3px 3px rgba(255,255,255,.35), inset 0 -4px 6px rgba(0,0,0,.25);
         transition:transform .05s, box-shadow .05s; }
  .btn:active, .btn.on { transform:translateY(5px); box-shadow:0 1px 0 var(--d), 0 2px 5px rgba(0,0,0,.45), inset 0 3px 3px rgba(255,255,255,.25), inset 0 -4px 6px rgba(0,0,0,.25); }
  #btnA { right:max(18px,6%); top:26px; --d:var(--red-d); background:radial-gradient(circle at 35% 28%, #ff8d96 0%, var(--red) 55%, #c63a46 100%); }
  #btnB { right:calc(max(18px,6%) + 92px); top:70px; --d:var(--gold-d); background:radial-gradient(circle at 35% 28%, #ffe58a 0%, var(--gold) 55%, #d6a21f 100%); color:#4a3500; text-shadow:0 1px 0 rgba(255,255,255,.4); }
  .hint { position:absolute; font-size:7px; letter-spacing:.06em; color:#8d96bd; text-transform:uppercase; }
  #hA { right:max(18px,6%); top:106px; width:74px; text-align:center; }
  #hB { right:calc(max(18px,6%) + 92px); top:150px; width:74px; text-align:center; }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <div id="bezel">
      <canvas id="game" width="960" height="640"></canvas>
      <div id="msg"><span id="txt"></span><i id="more">▼</i></div>
    </div>
  </div>
  <div id="pad">
    <div id="dpad">
      <div class="arm up" data-d="up"></div><div class="arm down" data-d="down"></div>
      <div class="arm left" data-d="left"></div><div class="arm right" data-d="right"></div>
      <div class="mid"></div>
    </div>
    <button class="btn" id="btnB">B</button><span class="hint" id="hB">Correr</span>
    <button class="btn" id="btnA">A</button><span class="hint" id="hA">Ação</span>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
