<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#101820">
<title>Monster Quest</title>
<style>
  :root { --bg:#101820; --panel:#1b2733; --accent:#f2c14e; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; -webkit-user-select:none; touch-action:none; }
  html,body { margin:0; height:100%; background:var(--bg); overflow:hidden; font-family:ui-monospace,Menlo,Consolas,monospace; color:#fff; }
  #app { display:flex; flex-direction:column; height:100%; padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
  #screen { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; position:relative; }
  canvas { image-rendering:pixelated; image-rendering:crisp-edges; background:#000; max-width:100%; max-height:100%; border:3px solid #000; box-shadow:0 0 0 3px #3a4a5c; }
  #msg { position:absolute; left:8px; right:8px; bottom:8px; background:#fffbe8; color:#222; border:3px solid #222; border-radius:6px; padding:10px 12px; font-size:14px; display:none; }
  #pad { height:170px; position:relative; flex:none; }
  #stick { position:absolute; left:20px; bottom:16px; width:140px; height:140px; border-radius:50%; background:rgba(255,255,255,.08); border:2px solid rgba(255,255,255,.25); }
  #knob { position:absolute; left:50%; top:50%; width:60px; height:60px; margin:-30px 0 0 -30px; border-radius:50%; background:rgba(242,193,78,.85); }
  #btnA { position:absolute; right:24px; bottom:40px; width:74px; height:74px; border-radius:50%; background:var(--accent); color:#222; font-size:26px; font-weight:bold; border:0; box-shadow:0 4px 0 #a37f1f; }
  #btnA:active { transform:translateY(3px); box-shadow:0 1px 0 #a37f1f; }
</style>
</head>
<body>
<div id="app">
  <div id="screen">
    <canvas id="game" width="240" height="160"></canvas>
    <div id="msg"></div>
  </div>
  <div id="pad">
    <div id="stick"><div id="knob"></div></div>
    <button id="btnA">A</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
